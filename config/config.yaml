video:
  source: 0

model:
  yolo_weight: "weights/yolo/yolov8n.pt"
  device: "auto"
  person_class_id: 0
  conf_threshold: 0.35
  iou_threshold: 0.50
  image_size: 640

runtime:
  num_workers: 0
  log_level: "INFO"

tracking:
  # Project-owned baseline; change this path for a controlled crowd A/B run.
  tracker: "config/trackers/botsort_baseline.yaml"
  persist: true
  show_track_id: true

selection:
  min_iou: 0.20

reid:
  model_name: "osnet_x0_25"
  weight: "weights/reid/osnet_x0_25_msmt17.pth"
  image_height: 256
  image_width: 128
  min_crop_width: 40
  min_crop_height: 100

reid_recovery:
  # Conservative, configurable engineering starting values; not universal optima.
  lost_grace_frames: 10
  reference_update_interval_frames: 15
  recovery_interval_frames: 10
  max_reference_embeddings: 8
  recovery_threshold: 0.75
  recovery_margin: 0.05
  reference_update_threshold: 0.80
  recovery_min_track_age_frames: 3
  recovery_confirmation_hits: 2
  recovery_pending_max_age_frames: 60

reid_quality:
  # Crowded-scene engineering starting values; not universal optima.
  min_track_confidence: 0.35
  max_edge_truncation_ratio: 0.30
  max_person_overlap_ratio: 0.50

gallery_recognition:
  # Conservative, configurable engineering starting values; not universal optima.
  enabled: true
  recognition_interval_frames: 10
  min_track_age_frames: 5
  recognition_threshold: 0.80
  recognition_margin: 0.05
  confirmation_hits: 2

database:
  path: "database/person_reid.db"

ui:
  window_name: "Person Tracking - MVP-8.1"
  wait_key_ms: 1
  show_class_name: true
  show_confidence: true
  show_unselected_tracks: false

diagnostics:
  enabled: true
  log_interval_frames: 300
