video:
  source: 0

model:
  yolo_weight: "weights/yolo/yolov8n.pt"
  device: "auto"
  person_class_id: 0
  conf_threshold: 0.35
  iou_threshold: 0.50
  image_size: 640

inference:
  # PC keeps the existing Ultralytics/Torchreid path. Atlas uses OM + pyACL.
  backend: "torch"

ascend:
  device_id: 0
  # These are project-relative OM paths; conversion output may be overridden here.
  yolo_model: "weights/atlas/yolov8n.om"
  reid_model: "weights/atlas/osnet_x0_25.om"
  reid_dynamic_batches: [1, 2, 4, 8]

runtime:
  num_workers: 0
  log_level: "INFO"

tracking:
  # Fixed-camera PC default; GMC is disabled in this profile.
  tracker: "config/trackers/botsort_fixed_camera.yaml"
  persist: true
  show_track_id: true

multiclass_tracking:
  # COCO: car=2, bus=5, truck=7. Motorcycle=3 remains disabled.
  vehicle_class_ids: [2, 5, 7]

selection:
  min_iou: 0.20

reid:
  model_name: "osnet_x0_25"
  weight: "weights/reid/osnet_x0_25_msmt17.pth"
  image_height: 256
  image_width: 128
  min_crop_width: 40
  min_crop_height: 100

vehicle_reid:
  # MVP-8.3-PC1 only; not connected to the person runtime pipeline yet.
  enabled: true
  model_name: "sbs_R50-ibn"
  weight: "weights/vehicle_reid/veri_sbs_R50-ibn.pth"
  config: "config/vehicle_reid/sbs_R50-ibn.yml"
  device: "auto"
  image_height: 256
  image_width: 256

vehicle_recovery:
  # AIC21 Track2 engineering initial values: 50 vehicles / 400 samples.
  # Recalibrate these values for the final deployment site.
  lost_grace_frames: 5
  reference_update_interval_frames: 15
  recovery_interval_frames: 5
  max_reference_embeddings: 8
  recovery_threshold: 0.60
  recovery_margin: 0.08
  reference_update_threshold: 0.55
  recovery_reference_support_threshold: 0.55
  recovery_reference_support_top_k: 3
  recovery_min_track_age_frames: 3
  recovery_confirmation_hits: 2
  recovery_pending_max_age_frames: 60
  recovery_candidates_per_frame: 1

reid_recovery:
  # Conservative, configurable engineering starting values; not universal optima.
  lost_grace_frames: 5
  reference_update_interval_frames: 15
  recovery_interval_frames: 5
  max_reference_embeddings: 8
  # Conservative engineering starting values based on the current test video;
  # these are not universal optima.
  recovery_threshold: 0.85
  recovery_margin: 0.05
  reference_update_threshold: 0.80
  recovery_reference_support_threshold: 0.80
  recovery_reference_support_top_k: 3
  recovery_min_track_age_frames: 3
  recovery_confirmation_hits: 2
  recovery_pending_max_age_frames: 60
  recovery_candidates_per_frame: 3

gallery_enrichment:
  # Conservative engineering starting value; not a universal optimum.
  post_recovery_stable_frames: 30
  max_reference_embeddings: 8
  duplicate_similarity_threshold: 0.95

reid_quality:
  # Crowded-scene engineering starting values; not universal optima.
  min_track_confidence: 0.35
  max_edge_truncation_ratio: 0.30
  max_person_overlap_ratio: 0.60
  min_frame_edge_margin_ratio: 0.01

vehicle_reid_quality:
  min_track_confidence: 0.35
  max_edge_truncation_ratio: 0.30
  max_vehicle_overlap_ratio: 0.60
  min_frame_edge_margin_ratio: 0.01
  min_crop_width: 40
  min_crop_height: 40

gallery_recognition:
  # Conservative, configurable engineering starting values; not universal optima.
  enabled: true
  recognition_interval_frames: 10
  min_track_age_frames: 5
  recognition_threshold: 0.80
  recognition_margin: 0.05
  confirmation_hits: 2
  recognition_candidates_per_frame: 3
  unmatched_retry_interval_frames: 15

vehicle_gallery_recognition:
  # AIC21 Track2 engineering starting values; recalibrate for deployment.
  enabled: true
  recognition_interval_frames: 5
  min_track_age_frames: 3
  recognition_threshold: 0.60
  recognition_margin: 0.08
  confirmation_hits: 2
  recognition_candidates_per_frame: 1
  unmatched_retry_interval_frames: 15

vehicle_gallery_enrichment:
  # Independent Vehicle policy; final deployment must be recalibrated.
  post_recovery_stable_frames: 30
  max_reference_embeddings: 8
  duplicate_similarity_threshold: 0.95

database:
  path: "database/person_reid.db"

vehicle_database:
  path: "database/vehicle_reid.db"

ui:
  window_name: "Person Tracking - MVP-8.2"
  wait_key_ms: 1
  max_display_width: 1280
  show_class_name: true
  show_confidence: true
  show_unselected_tracks: true

diagnostics:
  enabled: true
  log_interval_frames: 300
