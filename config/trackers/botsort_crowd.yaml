# MVP-8.1 crowd experiment profile.
# This is an A/B candidate, not a claimed optimum. Keep detection conf and
# image_size in config/config.yaml so they can be varied independently.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 60
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
