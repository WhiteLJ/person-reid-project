# Optional MVP-8.1 experiment. Use only if the installed Ultralytics version
# supports BoT-SORT appearance ReID. model:auto means Ultralytics' native
# encoder in the installed package; it is not the project's Torchreid OSNet.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 60
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto
