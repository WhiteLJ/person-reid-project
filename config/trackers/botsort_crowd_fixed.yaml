# Atlas fixed-camera benchmark profile only.
# Ultralytics 8.4.138 accepts gmc_method: none and normalizes it to no GMC.
# This is an experiment profile, not a general default for moving cameras.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 60
match_thresh: 0.8
fuse_score: True
gmc_method: none
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
